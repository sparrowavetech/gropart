    <style>
    html
    {
        box-sizing: border-box;
        overflow: -moz-scrollbars-vertical;
        overflow-y: scroll;
    }
    *,
    *:before,
    *:after
    {
        box-sizing: inherit;
    }

    body {
      margin:0;
      background: #fafafa;
    }

</head>

<body>
<div id="swagger-ui"></div>

<script src="https://shipping-api.com/api/v1/asset/swagger-ui-bundle.js?v=1af3ec62ad38bd8b4c1f99a31e07e58c"></script>
<script src="https://shipping-api.com/api/v1/asset/swagger-ui-standalone-preset.js?v=0e73555b7119ba9593b450964ce857a0"></script>
<script>
    window.onload = function() {
        // Build a system
        const ui = SwaggerUIBundle({
            dom_id: '#swagger-ui',
            url: "https://shipping-api.com/api/v1/api-docs-v1.json",
            operationsSorter: null,
            configUrl: null,
            validatorUrl: null,
            oauth2RedirectUrl: "https://shipping-api.com/api/v1/callback",

            requestInterceptor: function(request) {
                request.headers['X-CSRF-TOKEN'] = '';
                return request;
            },

            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],

            plugins: [
                SwaggerUIBundle.plugins.DownloadUrl
            ],

            layout: "StandaloneLayout",
            docExpansion : "none",
            deepLinking: true,
            filter: true,
            persistAuthorization: "false",

        })

        window.ui = ui
    }
</script>
